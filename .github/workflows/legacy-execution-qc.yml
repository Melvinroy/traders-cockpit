name: Legacy Execution QC

on:
  workflow_dispatch:

concurrency:
  group: legacy-execution-qc-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  legacy-execution-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_LEGACY_EXECUTION_QC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Legacy execution browser QC
        run: python scripts/ci/run_browser_qc.py
      - name: Upload execution QC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-execution-qc-artifacts
          path: |
            frontend/output/playwright/**
          if-no-files-found: warn
